name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Reusable step to scaffold platform and restore our lib
# Strategy: create a temp project, copy platform folders, keep our lib untouched

jobs:
  # ─────────────────────────────────────────
  # ANDROID APK
  # ─────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform into temp dir
        run: |
          flutter create --project-name all_in_one_pos --org com.jayaneth.pos --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/*.apk

  # ─────────────────────────────────────────
  # iOS IPA
  # ─────────────────────────────────────────
  build-ios:
    name: 🍎 iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold iOS platform into temp dir
        run: |
          flutter create --project-name all_in_one_pos --org com.jayaneth.pos --platforms ios /tmp/scaffold
          cp -r /tmp/scaffold/ios ./ios

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r JayanethPOS-iOS.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: Apple-iOS-IPA
          path: JayanethPOS-iOS.ipa

  # ─────────────────────────────────────────
  # WINDOWS EXE
  # ─────────────────────────────────────────
  build-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Windows platform into temp dir
        shell: pwsh
        run: |
          flutter create --project-name all_in_one_pos --org com.jayaneth.pos --platforms windows $env:TEMP\scaffold
          Copy-Item -Recurse -Force "$env:TEMP\scaffold\windows" .\windows

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath JayanethPOS-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-App
          path: JayanethPOS-Windows.zip

  # ─────────────────────────────────────────
  # macOS APP
  # ─────────────────────────────────────────
  build-macos:
    name: 🍏 macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold macOS platform into temp dir
        run: |
          flutter create --project-name all_in_one_pos --org com.jayaneth.pos --platforms macos /tmp/scaffold
          cp -r /tmp/scaffold/macos ./macos

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Zip macOS bundle
        run: |
          zip -r JayanethPOS-macOS.zip build/macos/Build/Products/Release/all_in_one_pos.app

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-Desktop-App
          path: JayanethPOS-macOS.zip

  # ─────────────────────────────────────────
  # WEB PWA
  # ─────────────────────────────────────────
  build-web:
    name: 🌐 Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Web platform into temp dir
        run: |
          flutter create --project-name all_in_one_pos --org com.jayaneth.pos --platforms web /tmp/scaffold
          cp -r /tmp/scaffold/web ./web

      - run: flutter pub get
      - run: flutter build web --release --web-renderer canvaskit

      - uses: actions/upload-artifact@v4
        with:
          name: Web-PWA
          path: build/web
