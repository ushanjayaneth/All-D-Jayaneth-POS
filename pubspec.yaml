name: all_in_one_pos
description: "A comprehensive cross-platform POS system for Windows, Android, iOS, and macOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Cross-Platform Local Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # PDF Generation & Direct Thermal Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Charts for Financial Analytics & Reports
  fl_chart: ^0.68.0

  # File Handling & Exporting
  csv: ^6.0.0
  file_picker: ^8.0.0+1

  # Web & WhatsApp Integration
  url_launcher: ^6.3.0

  # Modern Typography & UI
  google_fonts: ^6.2.1

  # Barcode generation
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
