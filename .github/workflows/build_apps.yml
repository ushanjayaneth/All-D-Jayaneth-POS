name: Build All Platforms (iOS, Android, Windows, Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create . --org com.jayaneth.pos
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build Apple iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create . --org com.jayaneth.pos --platforms=ios
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package iOS Payload (Unsigned IPA)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r JayanethPOS-iOS.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apple-iOS-IPA
          path: JayanethPOS-iOS.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create . --org com.jayaneth.pos --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Compress Windows Output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath JayanethPOS-Windows.zip
      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-App
          path: JayanethPOS-Windows.zip

  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create . --org com.jayaneth.pos --platforms=web
      - run: flutter pub get
      - run: flutter build web --release
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Web-PWA
          path: build/web
