name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # ANDROID APK
  # ─────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold (keep existing lib)
        run: |
          flutter create \
            --project-name all_in_one_pos \
            --org com.jayaneth.pos \
            --platforms android \
            --no-overwrite \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/*.apk

  # ─────────────────────────────────────────
  # iOS IPA
  # ─────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffold (keep existing lib)
        run: |
          flutter create \
            --project-name all_in_one_pos \
            --org com.jayaneth.pos \
            --platforms ios \
            --no-overwrite \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r JayanethPOS-iOS.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apple-iOS-IPA
          path: JayanethPOS-iOS.ipa

  # ─────────────────────────────────────────
  # WINDOWS EXE
  # ─────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform scaffold (keep existing lib)
        shell: bash
        run: |
          flutter create \
            --project-name all_in_one_pos \
            --org com.jayaneth.pos \
            --platforms windows \
            --no-overwrite \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath JayanethPOS-Windows.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-App
          path: JayanethPOS-Windows.zip

  # ─────────────────────────────────────────
  # macOS APP
  # ─────────────────────────────────────────
  build-macos:
    name: 🍏 Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS platform scaffold (keep existing lib)
        run: |
          flutter create \
            --project-name all_in_one_pos \
            --org com.jayaneth.pos \
            --platforms macos \
            --no-overwrite \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Zip macOS bundle
        run: |
          cd build/macos/Build/Products/Release/
          zip -r ~/JayanethPOS-macOS.zip all_in_one_pos.app
          cd -

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Desktop-App
          path: ~/JayanethPOS-macOS.zip

  # ─────────────────────────────────────────
  # WEB PWA
  # ─────────────────────────────────────────
  build-web:
    name: 🌐 Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform scaffold (keep existing lib)
        run: |
          flutter create \
            --project-name all_in_one_pos \
            --org com.jayaneth.pos \
            --platforms web \
            --no-overwrite \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (release)
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: Web-PWA
          path: build/web
